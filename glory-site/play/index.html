function fitRig(model, holder, height) {
  holder.add(model); holder.updateMatrixWorld(true);
  const bb = new THREE.Box3(); model.traverse(o => { if (o.isBone) bb.expandByPoint(o.getWorldPosition(new THREE.Vector3())); });
  const s = height / (bb.max.y - bb.min.y); model.scale.multiplyScalar(s); holder.updateMatrixWorld(true);
  const hips = model.getObjectByName('mixamorigHips').getWorldPosition(new THREE.Vector3()).sub(holder.getWorldPosition(new THREE.Vector3()));
  const b2 = new THREE.Box3(); model.traverse(o => { if (o.isBone) b2.expandByPoint(o.getWorldPosition(new THREE.Vector3())); });
  model.position.x -= hips.x; model.position.z -= hips.z; model.position.y -= b2.min.y - holder.position.y;
  return s * (model.scale.x / s) / 1; }
